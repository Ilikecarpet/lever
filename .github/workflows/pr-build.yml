name: PR Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install --prefix ui

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Ensure cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No updater artifact here: signing it needs TAURI_SIGNING_PRIVATE_KEY,
      # which fork and Dependabot PRs never get. The release build makes the
      # signed one.
      - name: Build Tauri app (validation)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
